name: Integrar trabajo de Samuel

on:
  push:
    branches:
      - feature/mapas-samuel
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4

      - name: Aplicar implementación
        run: |
          git config user.name "Samuel Giraldo"
          git config user.email "Segiraldo0610@users.noreply.github.com"
          base64 --decode .github/workflows/cambios.b64 | tar -xJf -
          rm .github/workflows/android.yml
          git rm app/src/main/java/com/sebastianysamuel/taller2/ui/map/MapPlaceholderScreen.kt
          git add README.md app docs gradle gradlew
          git commit -m "feat: completar mapas y preparar la entrega"
          git push
